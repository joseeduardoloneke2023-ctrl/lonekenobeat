<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Seguro | LONEKE NO BEAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; overflow-x: hidden; }
        .payment-card.active { border-color: #dc2626; background: rgba(220, 38, 38, 0.05); }
        .cart-item { transition: all 0.3s ease; }
        .file-input-wrapper { transition: all 0.3s ease; border: 2px dashed rgba(255,255,255,0.1); }
        .file-input-wrapper:hover { border-color: #dc2626; background: rgba(220, 38, 38, 0.02); }
        
   
        input:focus, select:focus { border-color: #dc2626 !important; box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <nav class="w-full bg-black/90 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="../index.html" class="text-2xl font-black italic uppercase tracking-tighter">
                LONEKE NO<span class="text-red-600">BEAT</span>
            </a>
            <div class="flex items-center gap-4 text-[10px] font-black uppercase tracking-widest text-gray-500">
                <span class="text-red-600">Checkout</span>
                <i data-lucide="chevron-right" size="14"></i>
                <span>Finalização Manual</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="grid lg:grid-cols-12 gap-12">
            
       
            <div class="lg:col-span-8 space-y-12">
                
           
                <section>
                    <h2 class="text-2xl font-black uppercase italic mb-6 flex items-center gap-3 text-white/90">
                        <span class="bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm not-italic">1</span>
                        Revisar Itens
                    </h2>
                    <div id="cart-items-container" class="space-y-4"></div>
                </section>


                <section class="bg-[#0d0d0d] p-8 rounded-3xl border border-white/10 shadow-sm">
                    <h2 class="text-2xl font-black uppercase italic mb-6 flex items-center gap-3 text-white/90">
                        <span class="bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm not-italic">2</span>
                        Seu Perfil de Entrega
                    </h2>
                    <div class="grid md:grid-cols-2 gap-5">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-gray-500 tracking-widest ml-1">Nome Completo</label>
                            <input type="text" id="cus-name" placeholder="EX: PEDRO DOS SANTOS" class="w-full bg-black border border-white/10 rounded-xl p-4 text-xs font-bold uppercase outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-gray-500 tracking-widest ml-1">E-mail (Para receber os Beats)</label>
                            <input type="email" id="cus-email" placeholder="EX: SEUEMAIL@GMAIL.COM" class="w-full bg-black border border-white/10 rounded-xl p-4 text-xs font-bold outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-gray-500 tracking-widest ml-1">WhatsApp</label>
                            <input type="tel" id="cus-phone" placeholder="+244 000 000 000" class="w-full bg-black border border-white/10 rounded-xl p-4 text-xs font-bold outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-gray-500 tracking-widest ml-1">País</label>
                            <select id="cus-country" class="w-full bg-black border border-white/10 rounded-xl p-4 text-xs font-bold uppercase outline-none transition-all text-white">
                                <option value="Angola">Angola</option>
                                <option value="Portugal">Portugal</option>
                                <option value="Brasil">Brasil</option>
                                <option value="Outro">Outro País</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-2xl font-black uppercase italic mb-6 flex items-center gap-3 text-white/90">
                        <span class="bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm not-italic">3</span>
                        Pagamento e Comprovativo
                    </h2>
                    
                    <div class="grid md:grid-cols-3 gap-4 mb-8">
                        <div onclick="selectPayment('express')" id="btn-express" class="payment-card border border-white/10 p-5 rounded-2xl cursor-pointer hover:border-red-600 transition-all text-center">
                            <p class="font-black uppercase text-[10px] tracking-widest">MCX Express</p>
                        </div>
                        <div onclick="selectPayment('bank')" id="btn-bank" class="payment-card border border-white/10 p-5 rounded-2xl cursor-pointer hover:border-red-600 transition-all text-center">
                            <p class="font-black uppercase text-[10px] tracking-widest">Transf. Angola</p>
                        </div>
                        <div onclick="selectPayment('europa')" id="btn-europa" class="payment-card border border-white/10 p-5 rounded-2xl cursor-pointer hover:border-red-600 transition-all text-center">
                            <p class="font-black uppercase text-[10px] tracking-widest">Transf. Europa</p>
                        </div>
                    </div>

                    <div id="payment-details" class="hidden bg-[#0d0d0d] border border-white/10 p-6 rounded-3xl mb-6 shadow-inner">
                        <div id="detail-content"></div>
                    </div>

                    <div class="bg-[#0d0d0d] border border-white/10 p-6 rounded-3xl">
                        <p class="text-[10px] font-black uppercase text-gray-500 mb-4 tracking-widest text-center">Anexe o comprovativo oficial (Foto ou PDF):</p>
                        <input type="file" id="cus-file" name="comprovativo" accept="image/*,.pdf" class="hidden">
                        <label for="cus-file" class="file-input-wrapper flex flex-col items-center justify-center gap-3 w-full py-10 rounded-2xl cursor-pointer">
                            <i data-lucide="upload-cloud" class="text-red-600" id="upload-icon"></i>
                            <span id="file-name" class="text-xs font-black uppercase text-gray-400">Selecionar Comprovativo</span>
                            <span class="text-[9px] text-gray-600 font-bold uppercase">PNG, JPG ou PDF (Máx 5MB)</span>
                        </label>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-4">
                <div class="bg-[#0d0d0d] p-8 rounded-3xl border border-white/10 sticky top-32 shadow-2xl border-t-red-600/50 border-t-2">
                    <h3 class="text-xl font-black uppercase mb-6 italic">Resumo do Pedido</h3>
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between text-gray-400 text-xs font-black uppercase tracking-widest">
                            <span>Subtotal</span>
                            <span id="subtotal-val">0 Kz</span>
                        </div>
                        <div class="pt-4 border-t border-white/5 flex justify-between items-end">
                            <span class="font-black uppercase italic text-lg">Total</span>
                            <span id="total-val" class="text-4xl font-black text-red-600 tracking-tighter">0 Kz</span>
                        </div>
                    </div>
                    <button id="main-submit-btn" onclick="submitOrder()" class="w-full bg-red-600 hover:bg-white hover:text-black text-white py-6 rounded-2xl font-black uppercase text-sm tracking-[0.2em] transition-all duration-500 shadow-lg shadow-red-600/10">
                        Finalizar Pedido
                    </button>
                    <p class="text-center mt-6 text-[9px] text-gray-500 font-bold uppercase tracking-widest">
                        <i data-lucide="shield-check" class="inline-block mr-1 mb-1" size="12"></i> Pagamento 100% Seguro
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="../produtos.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('loneke_cart')) || [];
        let selectedMethod = '';

        document.getElementById('cus-file').addEventListener('change', function() {
            const fileName = this.files[0] ? this.files[0].name : "Selecionar Comprovativo";
            document.getElementById('file-name').innerText = fileName.toUpperCase();
            document.getElementById('file-name').style.color = "#dc2626";
            document.getElementById('upload-icon').style.color = "#22c55e"; // Ícone fica verde ao anexar
        });

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const subtotalEl = document.getElementById('subtotal-val');
            const totalEl = document.getElementById('total-val');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="py-16 text-center border border-dashed border-white/10 rounded-3xl">
                        <i data-lucide="shopping-cart" class="mx-auto mb-4 text-gray-800" size="40"></i>
                        <p class="text-gray-500 uppercase font-black text-xs tracking-widest">Seu carrinho está vazio</p>
                        <a href="../index.html" class="inline-block mt-4 text-red-600 font-bold uppercase text-[10px] border-b border-red-600">Voltar para Beats</a>
                    </div>`;
                return;
            }

            let totalSum = 0;
            container.innerHTML = cart.map((item, index) => {
                totalSum += parseInt(item.preco.toString().replace(/[^0-9]/g, '')) || 0;
                const imgSrc = item.imagem.startsWith('http') ? item.imagem : `../${item.imagem}`;

                return `
                    <div class="cart-item bg-[#0d0d0d] p-5 rounded-2xl border border-white/5 flex justify-between items-center hover:border-white/10 transition-all">
                        <div class="flex items-center gap-5">
                            <div class="relative">
                                <img src="${imgSrc}" class="w-14 h-14 rounded-xl object-cover border border-white/10 shadow-lg">
                                <div class="absolute -top-2 -left-2 bg-red-600 text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center">1</div>
                            </div>
                            <div>
                                <h4 class="font-black uppercase text-xs italic tracking-tight">${item.nome}</h4>
                                <p class="text-red-600 font-bold text-[10px] mt-1">${item.preco} KZ</p>
                            </div>
                        </div>
                        <button onclick="removeItem(${index})" class="text-gray-600 hover:text-red-600 transition-colors p-2">
                            <i data-lucide="trash-2" size="18"></i>
                        </button>
                    </div>`;
            }).join('');

            const formattedTotal = new Intl.NumberFormat('pt-AO').format(totalSum) + " Kz";
            subtotalEl.innerText = formattedTotal;
            totalEl.innerText = formattedTotal;
            lucide.createIcons();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('loneke_cart', JSON.stringify(cart));
            renderCart();
        }

        function copyText(text, btnId) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById(btnId);
                const original = btn.innerText;
                btn.innerText = "COPIADO";
                btn.style.color = "#22c55e";
                setTimeout(() => {
                    btn.innerText = original;
                    btn.style.color = "";
                }, 2000);
            });
        }

        function selectPayment(method) {
            selectedMethod = method;
            document.querySelectorAll('.payment-card').forEach(el => el.classList.remove('active', 'border-red-600', 'bg-red-600/5'));
            document.getElementById(`btn-${method}`).classList.add('active', 'border-red-600', 'bg-red-600/5');
            document.getElementById('payment-details').classList.remove('hidden');
            
            const content = document.getElementById('detail-content');
            if(method === 'express') {
                content.innerHTML = `
                    <div class="flex justify-between items-center bg-black p-4 rounded-xl border border-white/5">
                        <div>
                            <p class="text-[9px] text-gray-500 uppercase font-bold tracking-widest">Entidade Express (AOA)</p>
                            <span class="text-xl font-black tracking-tighter">936 380 720</span>
                        </div>
                        <button id="cp-exp" onclick="copyText('936380720', 'cp-exp')" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-[10px] font-black transition-all">COPIAR</button>
                    </div>`;
            } else if(method === 'bank') {
                content.innerHTML = `
                    <div class="bg-black p-4 rounded-xl border border-white/5 space-y-4">
                        <div>
                            <p class="text-[9px] text-gray-500 uppercase font-bold tracking-widest">IBAN AO (BIC / AOA)</p>
                            <div class="flex justify-between items-center mt-1">
                                <span class="text-[11px] font-black break-all uppercase tracking-tighter">AO06 0051 0000 0538 9050 1411 8</span>
                                <button id="cp-iban" onclick="copyText('AO06005100000538905014118', 'cp-iban')" class="bg-white/10 px-4 py-2 rounded-lg text-[10px] font-black shrink-0 ml-2">COPIAR</button>
                            </div>
                        </div>
                    </div>`;
            } else {
                content.innerHTML = `
                    <div class="bg-black p-4 rounded-xl border border-white/5">
                        <p class="text-[9px] text-gray-500 uppercase font-bold tracking-widest">IBAN EUR (Europa)</p>
                        <div class="flex justify-between items-center font-black text-[11px] mt-1">
                            <span>LU16 4080 0000 4422 5147</span>
                            <button onclick="copyText('LU164080000044225147', 'cp-eur')" id="cp-eur" class="bg-white/10 px-4 py-2 rounded-lg">COPIAR</button>
                        </div>
                    </div>`;
            }
        }


        async function submitOrder() {
            const name = document.getElementById('cus-name').value.trim();
            const email = document.getElementById('cus-email').value.trim();
            const phone = document.getElementById('cus-phone').value.trim();
            const country = document.getElementById('cus-country').value;
            const total = document.getElementById('total-val').innerText;
            const fileInput = document.getElementById('cus-file');

     
            if(!name || !email || !phone || !selectedMethod || cart.length === 0) {
                Swal.fire({ icon: 'warning', title: 'DADOS INCOMPLETOS', text: 'Por favor, preencha todos os campos e selecione o método de pagamento.', background: '#0d0d0d', color: '#fff', confirmButtonColor: '#dc2626' });
                return;
            }

            if (!fileInput.files[0]) {
                Swal.fire({ icon: 'warning', title: 'FALTA COMPROVATIVO', text: 'Você precisa anexar o comprovativo para que possamos validar o seu pedido.', background: '#0d0d0d', color: '#fff', confirmButtonColor: '#dc2626' });
                return;
            }

            const btn = document.getElementById('main-submit-btn');
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin inline-block mr-2"></i> ENVIANDO...`;
            btn.disabled = true;
            lucide.createIcons();

            const formData = new FormData();
            formData.append('NOME_CLIENTE', name);
            formData.append('EMAIL', email);
            formData.append('WHATSAPP', phone);
            formData.append('PAIS', country);
            formData.append('METODO_PAGAMENTO', selectedMethod.toUpperCase());
            formData.append('TOTAL_PEDIDO', total);
            formData.append('BEATS_PEDIDOS', cart.map(i => i.nome).join(' | '));
            formData.append('COMPROVATIVO', fileInput.files[0]);

            try {

                const response = await fetch('https://formbold.com/s/3Km8A', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'PEDIDO EM ANÁLISE!',
                        html: 'Recebemos seu comprovativo. Suas licenças serão enviadas para o e-mail <b>' + email + '</b> em até 1 hora.',
                        background: '#0d0d0d',
                        color: '#fff',
                        confirmButtonColor: '#dc2626'
                    }).then(() => {
                        localStorage.removeItem('loneke_cart');
                        window.location.href = '../index.html';
                    });
                } else {
                    throw new Error("Erro no servidor");
                }
            } catch (e) {
                console.error("Erro detalhado:", e);
                Swal.fire({ 
                    icon: 'error', 
                    title: 'FALHA NO ENVIO', 
                    html: `Não conseguimos processar o arquivo agora. Envie o comprovativo direto para o nosso <b>WhatsApp</b> para receber seus Beats na hora!`, 
                    showCancelButton: true,
                    confirmButtonText: 'ABRIR WHATSAPP',
                    cancelButtonText: 'TENTAR NOVAMENTE',
                    background: '#0d0d0d', 
                    color: '#fff',
                    confirmButtonColor: '#25d366'
                }).then((res) => {
                    if (res.isConfirmed) {
                        const msg = `Olá Loneke! Fiz um pedido no site de ${total}. Meu nome é ${name}. Aqui está o comprovativo.`;
                        window.open(`https://wa.me/244936380720?text=${encodeURIComponent(msg)}`);
                    }
                });
                
                btn.innerText = "Finalizar Pedido";
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        window.onload = () => { renderCart(); lucide.createIcons(); };
    </script>
</body>
</html>
