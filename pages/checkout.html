<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Checkout | LONEKE NO BEAT</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { background: #020202; color: #fff; font-family: 'Inter', sans-serif; }
        .glow-card { background: linear-gradient(180deg, #111 0%, #050505 100%); border: 1px solid #222; }
        .payment-btn.active { border-color: #dc2626 !important; background: linear-gradient(45deg, #dc2626, #991b1b); color: white; }
    </style>
</head>
<body class="py-12 px-6">
    <main class="max-w-2xl mx-auto">
        <!-- HEADER -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black uppercase italic tracking-tighter">Finalize sua <span class="text-red-600">Compra</span></h1>
            <p class="text-gray-500 text-sm mt-2 font-bold uppercase tracking-widest">Entrega imediata em seu e-mail</p>
        </div>

        <!-- CARRINHO -->
        <section class="mb-10">
            <div id="cart-items-container" class="space-y-3"></div>
            <div class="flex justify-between items-center px-4 py-6 border-b border-white/10">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Subtotal</span>
                <span id="total-val" class="text-2xl font-black italic">0 Kz</span>
            </div>
        </section>

        <!-- FORMULÁRIO -->
        <section class="glow-card p-8 rounded-[2rem] space-y-6">
            <div class="grid grid-cols-1 gap-4">
                <input type="text" id="cus-name" placeholder="NOME COMPLETO" class="w-full bg-[#0a0a0a] border border-[#222] p-5 rounded-2xl text-sm font-bold placeholder:text-gray-700 outline-none focus:border-red-600 transition">
                <div class="grid grid-cols-2 gap-4">
                    <input type="email" id="cus-email" placeholder="E-MAIL" class="w-full bg-[#0a0a0a] border border-[#222] p-5 rounded-2xl text-sm font-bold placeholder:text-gray-700 outline-none focus:border-red-600 transition">
                    <input type="tel" id="cus-phone" placeholder="WHATSAPP" class="w-full bg-[#0a0a0a] border border-[#222] p-5 rounded-2xl text-sm font-bold placeholder:text-gray-700 outline-none focus:border-red-600 transition">
                </div>
            </div>

            <div class="space-y-4">
                <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Escolha a forma de pagamento</p>
               <div class="grid grid-cols-2 gap-3">

    <!-- MULTICAIXA EXPRESS -->
    <button
        onclick="setMethod('multicaixa')"
        id="btn-multicaixa"
        class="payment-btn border border-[#222] p-4 rounded-2xl transition-all flex flex-col items-center justify-center gap-3"
    >
        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdODyOsuyWEn7gxhb53xUsmsjusKWpUI0Kfg&s"
            alt="Multicaixa Express"
            class="h-12 object-contain"
        >
        <span class="text-[10px] font-black uppercase">
            Pagamento Express
        </span>
    </button>

    <!-- REFERÊNCIA -->
    <button
        onclick="setMethod('reference')"
        id="btn-reference"
        class="payment-btn border border-[#222] p-4 rounded-2xl transition-all flex flex-col items-center justify-center gap-3"
    >
        <img
            src="https://paygooo.goootrafego.com/assets/payment-reference-DiwVrY_z.png"
            alt="Pagamento por Referência"
            class="h-12 object-contain"
        >
        <span class="text-[10px] font-black uppercase">
            Pagamento por Referência
        </span>
    </button>

</div>
            </div>

            <button onclick="processPayment()" class="w-full bg-white text-black py-5 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all duration-300">
                Finalizar Pedido
            </button>
        </section>
    </main>

<script>
    let cart = JSON.parse(localStorage.getItem('loneke_cart')) || [];
    let selectedMethod = '';

    function setMethod(method) {
        selectedMethod = method;
        document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + method).classList.add('active');
    }

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        if (!container) return;
        let total = 0;
        container.innerHTML = cart.map((item, index) => {
            const precoNumerico = typeof item.preco === 'string' ? parseFloat(item.preco.replace(/\D/g,'')) : item.preco;
            total += precoNumerico;
            const imagemSrc = item.imagem.startsWith('../') ? item.imagem : '../' + item.imagem;
            return `
                <div class="flex items-center gap-4 p-3 bg-white/5 rounded-2xl">
                    <img src="${imagemSrc}" onerror="this.src='https://via.placeholder.com/150'" class="w-14 h-14 rounded-xl object-cover bg-zinc-800">
                    <div class="flex-grow">
                        <h4 class="text-xs font-black uppercase">${item.nome}</h4>
                        <p class="text-[10px] text-red-600 font-bold">${precoNumerico.toLocaleString('pt-AO')} Kz</p>
                    </div>
                    <button onclick="removeItem(${index})" class="text-gray-600 hover:text-red-500 transition p-2"><i data-lucide="trash-2" size="16"></i></button>
                </div>
            `;
        }).join('');
        document.getElementById('total-val').innerText = total.toLocaleString('pt-AO') + ' Kz';
        lucide.createIcons();
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('loneke_cart', JSON.stringify(cart));
        renderCart();
    }

    function copiarTexto(texto, nomeCampo) {
        navigator.clipboard.writeText(texto).then(() => {
            const toast = document.createElement('div');
            toast.innerText = nomeCampo + ' copiado!';
            toast.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#dc2626; color:white; padding:10px 20px; border-radius:10px; z-index:9999; font-size:12px; font-weight:bold;';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        });
    }

    async function processPayment() {
        if (!selectedMethod) return Swal.fire('Aviso', 'Selecione um método de pagamento', 'warning');
        
        const name = document.getElementById('cus-name').value;
        const email = document.getElementById('cus-email').value;
        const phone = document.getElementById('cus-phone').value;

        if (!name || !email || !phone) return Swal.fire('Erro', 'Preencha todos os dados.', 'error');

        const payload = {
            items: cart.map(item => ({ product_id: item.product_id, quantity: 1 })),
            payment_method: selectedMethod,
            customer_name: name,
            customer_email: email,
            customer_phone: phone
        };

        try {
            Swal.fire({ title: 'A processar...', allowOutsideClick: false });
            Swal.showLoading();

            const response = await fetch('https://rouxavcvorjiwhpjhsye.supabase.co/functions/v1/api-v1/payments', {
                method: 'POST',
                headers: {
                    'x-api-key': 'pgoo_K5MkbjtCC5aZoZX4wgT43BbQeMCFBLJCI8cjAFK3',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro no processamento');

            if (selectedMethod === 'reference') {
    const refData = data.data || data.payment || data;
    
    // Função para extrair a referência, não importa o formato
    let refFinal = refData.reference || refData.referencia || refData.reference_number || 'Erro ao gerar';
    
    // Se ainda for um objeto, tenta extrair o valor de forma inteligente
    if (typeof refFinal === 'object') {
        refFinal = refFinal.reference_number || Object.values(refFinal)[0] || 'Erro';
    }

    Swal.fire({
        title: 'Pagamento por Referência',
        allowOutsideClick: false,
        html: `
            <div class="text-left mt-4 p-5 bg-[#0a0a0a] rounded-2xl border border-red-600/20 text-white">
                <div class="mb-4 flex justify-between items-center border-b border-white/10 pb-3">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase">Entidade</p>
                        <p class="text-lg font-black">${refData.entity || '11170'}</p>
                    </div>
                    <button type="button" onclick="copiarTexto('${refData.entity || '11170'}', 'Entidade')" class="bg-white/10 px-3 py-1 rounded-lg text-[10px] font-bold">COPIAR</button>
                </div>
                <div class="mb-4 flex justify-between items-center border-b border-white/10 pb-3">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase">Referência</p>
                        <p class="text-xl font-black text-red-500 tracking-widest">${refFinal}</p>
                    </div>
                    <button type="button" onclick="copiarTexto('${refFinal}', 'Referência')" class="bg-red-600 px-3 py-1 rounded-lg text-[10px] font-bold">COPIAR</button>
                </div>
            </div>`,
        confirmButtonText: 'Fechar',
        background: '#020202', color: '#fff'
    });
} else if (selectedMethod === 'stripe') {
                window.location.href = data.url || data.payment_url;
            } else {
                Swal.fire({ title: 'Sucesso!', text: 'Pedido gerado. Verifique o seu telemóvel.', icon: 'success', background: '#020202', color: '#fff' });
            }
        } catch (error) {
            Swal.fire('Erro no Pagamento', error.message, 'error');
        }
    }

    window.onload = () => { renderCart(); lucide.createIcons(); };
</script>
</body>
</html>
