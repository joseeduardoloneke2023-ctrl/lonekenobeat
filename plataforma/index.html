<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login VIP | Loneke no Beat</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #E50914;
            --bg: #0a0a0a;
            --card-bg: rgba(23, 23, 23, 0.7);
            --white: #FFFFFF;
            --text-secondary: #aaaaaa;
        }
        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-box {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 3.5rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { font-family: 'Montserrat', sans-serif; font-weight: 800; margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; text-align: left; }
        label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .form-control { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1.1rem; color: var(--white); font-size: 0.95rem; transition: all 0.3s; box-sizing: border-box; }
        .form-control:focus { border-color: var(--primary); outline: none; }
        
        select.form-control {
            cursor: pointer;
            color: var(--white);
        }
        select.form-control option {
            background: #111;
            color: var(--white);
        }

        .toggle-password {
            position: absolute;
            right: 1.1rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s;
        }
        .toggle-password:hover { color: var(--white); }

        .forgot-link-container {
            text-align: right;
            margin-top: -0.8rem;
            margin-bottom: 1.8rem;
        }
        .forgot-link {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-link:hover { color: var(--primary); text-decoration: underline; }

        .btn-login { width: 100%; padding: 1.1rem; background: var(--primary); border: none; color: white; font-weight: 600; border-radius: 12px; cursor: pointer; font-size: 1rem; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-login:hover { background: #b8070e; }
        .btn-login:disabled { background: #555555; cursor: not-allowed; opacity: 0.6; }
        
        #error-msg { color: #ff3333; font-size: 0.9rem; margin-top: 1rem; display: none; }
        
        .new { 
            margin-top: 1.2rem; 
        }

        .new-btn { 
            display: block;
            width: 100%; 
            box-sizing: border-box;
            text-decoration: none; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            color: var(--white); 
            font-weight: 600; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem; 
            padding: 1.1rem;
            text-align: center;
            transition: all 0.3s ease; 
        }
        .new-btn:hover { 
            background: rgba(255, 255, 255, 0.1); 
            border-color: rgba(255, 255, 255, 0.35);
            color: var(--white);
        }
   </style>
</head>
<body>

    <div class="login-box">
        <h2>ÁREA DO ALUNO</h2>
        <p>Insira as credenciais fornecidas após o pagamento.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Tipo de Plano / Conta</label>
                <select id="accountType" class="form-control" required>
                    <option value="normal">Cliente Normal</option>
                    <option value="vip_inicial">Cliente VIP - Plano Inicial</option>
                    <option value="vip_pro">Cliente VIP - Plano Pro</option>
                    <option value="vip_master">Cliente VIP - Plano Master</option>
                    <option value="vip_elite">Cliente VIP - Plano Elite Anual</option>
                </select>
            </div>

            <div class="form-group">
                <label>Utilizador ou E-mail</label>
                <input type="text" id="username" class="form-control" placeholder="Ex: pedro ou pedro@gmail.com" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>Senha de Acesso</label>
                <div class="password-container">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right: 3rem;">
                    <i class="fa-solid fa-eye toggle-password" id="btnTogglePass"></i>
                </div>
            </div>
            
            <div class="forgot-link-container">
                <a href="https://wa.me/244924034159?text=Ol%C3%A1%20Loneke!%20Esqueci-me%20da%20minha%20senha%20de%20acesso%20ao%20Painel%20VIP.%20Pode%20ajudar-me%3F" target="_blank" class="forgot-link">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-login" id="btnLoginSubmit">
                <i class="fa-solid fa-right-to-bracket"></i> <span>Entrar no Painel</span>
            </button>

            <div id="error-msg">Utilizador ou senha incorretos!</div>
        </form>

        <div class="new">
            <a href="../index.html" class="new-btn">CONTINUAR SEM CONTA</a>
        </div>
    </div>

    <script>
        const btnTogglePass = document.getElementById('btnTogglePass');
        const passwordInput = document.getElementById('password');
        const btnLoginSubmit = document.getElementById('btnLoginSubmit');
        const btnLoginContent = btnLoginSubmit.innerHTML;

        btnTogglePass.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
            
            this.style.color = isPassword ? 'var(--primary)' : 'var(--text-secondary)';
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userInput = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const accountType = document.getElementById('accountType').value;
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.style.display = "none";

            // Ativa o feedback visual de carregamento rápido e bloqueia cliques extras
            btnLoginSubmit.disabled = true;
            btnLoginSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>A processar...</span>`;

            const scriptId = "dynamic-student-script";
            const oldScript = document.getElementById(scriptId);
            if (oldScript) oldScript.remove(); 

            const nomeArquivo = userInput.includes('@') ? userInput.split('@')[0] : userInput;

            let srcPath = "";
            if (accountType === "normal") {
                srcPath = `bd/aluno_${nomeArquivo}.js`;
            } else {
                srcPath = `bd/vip/${accountType}_${nomeArquivo}.js`;
            }

            const script = document.createElement('script');
            script.id = scriptId;
            script.src = srcPath; 

            script.onload = function() {
                let dadosUser = null;
                
                if (typeof dadosAluno !== 'undefined' && dadosAluno.usuario) {
                    dadosUser = dadosAluno.usuario;
                } else if (typeof dadosVip !== 'undefined' && dadosVip.usuario) {
                    dadosUser = dadosVip.usuario;
                }

                if (dadosUser) {
                    const loginValido = (userInput === dadosUser.username.toLowerCase() || userInput === dadosUser.email.toLowerCase());
                    const senhaValida = (dadosUser.senha === password);

                    if (loginValido && senhaValida) {
                        localStorage.setItem('loggedStudentFile', srcPath);
                        
                        if (accountType === "normal") {
                            window.location.href = "aluno.html";
                        } else {
                            window.location.href = "vip.html";
                        }
                    } else {
                        exibirErro("Senha ou dados de acesso incorretos!");
                    }
                } else {
                    exibirErro("Erro ao processar dados do utilizador.");
                }
            };

            script.onerror = function() {
                exibirErro("Utilizador ou E-mail não encontrado para este plano!");
            };

            // Função interna para resetar o botão e exibir o erro correto
            function exibirErro(mensagem) {
                errorMsg.innerText = mensagem;
                errorMsg.style.display = "block";
                btnLoginSubmit.disabled = false;
                btnLoginSubmit.innerHTML = btnLoginContent;
            }

            document.head.appendChild(script);
        });
    </script>
</body>
</html>
